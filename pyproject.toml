[project]
name = "cournot"
version = "0.1.0"
description = "Cournot — a conditional probability estimator. Phase 1: eval harness + leakage detector."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
# Reading the normalized corpus. Deliberately not a core dependency: cournot.ingest
# does no IO, so nothing in src/ imports polars and the tests need no corpus.
ingest = ["polars>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "mutmut>=3.7.0",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cournot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
# mutmut writes a mutated copy of the whole tree to mutants/; it is build
# output and linting it produced 1,443 spurious errors.
extend-exclude = ["mutants"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF",
    "TID", # tidy imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.mutmut]
source_paths = ["src/cournot"]
pytest_add_cli_args_test_selection = ["tests/"]
# Required: tests/test_category_ground_truth.py loads a module from scripts/ by
# path, and without this mutmut fails at stats collection with a FileNotFoundError
# that does not name the cause.
also_copy = ["scripts/"]
